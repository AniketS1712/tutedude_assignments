name: day_script
description: "Day Script — A beautiful personal diary app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Navigation
  go_router: ^14.8.1

  # Rich Text
  flutter_quill: ^11.1.0

  # Image Handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Utils
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.0
  share_plus: ^10.1.4
  lottie: ^3.3.1
  uuid: ^4.5.1

  # UI
  google_fonts: ^6.2.1
  table_calendar: ^3.2.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#E8A838"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

# Flutter Native Splash configuration
flutter_native_splash:
  color: "#E8A838"
  image: "assets/icons/splash_logo.png"
  android: true
  ios: false

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/lottie/
    - assets/icons/
